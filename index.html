<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Babel Sword: Reignition</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #05070d;
        overflow: hidden;
        font-family: 'Segoe UI', system-ui, sans-serif;
      }
      #game-root {
        width: 100vw;
        height: 100vh;
        display: grid;
        place-items: center;
      }
      #game-root canvas {
        display: block;
        image-rendering: pixelated;
      }
      #boot-error {
        display: none;
        position: fixed;
        inset: 0;
        padding: 4vh 6vw;
        color: #ffd7d7;
        background: #14060a;
        font: 14px/1.6 ui-monospace, Consolas, monospace;
        white-space: pre-wrap;
        overflow: auto;
        z-index: 999;
      }
    </style>
  </head>
  <body>
    <div id="game-root"></div>
    <pre id="boot-error"></pre>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
